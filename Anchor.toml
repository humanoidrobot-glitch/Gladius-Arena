[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
gladius = "6R9YnVRjEryqxDbE4p6PQvP6PaPuXKhntojAU7RzmSDA"

[programs.localnet]
gladius = "6R9YnVRjEryqxDbE4p6PQvP6PaPuXKhntojAU7RzmSDA"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 'tests/program/**/*.ts'"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899

# mpl-core lives on devnet/mainnet; bundle it into the local validator
# from a captured fixture so mint_attestation's CPI works in tests.
# Fixture is captured via:
#   solana program dump CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d \
#     tests/fixtures/mpl_core.so --url devnet
[[test.genesis]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
program = "./tests/fixtures/mpl_core.so"
