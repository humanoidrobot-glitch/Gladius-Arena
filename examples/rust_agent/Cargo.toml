[package]
name = "gladius-rust-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-sdk = "1.18"
solana-client = "1.18"
ed25519-dalek = "2"
bs58 = "0.5"
base64 = "0.22"
anyhow = "1"
dotenvy = "0.15"
